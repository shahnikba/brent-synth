[project]
name = "brent-synth"
version = "0.1.0"
description = "Brent crude data layer and synthetic price-path research."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "yfinance==1.7.0",
    "pandas>=2.2,<3.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "arch==8.0.0",
    "matplotlib>=3.11.1",
]

[project.scripts]
brent-synth-backtest = "brent_synth.backtest:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brent_synth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
